.dre-intro__fold--left {
  clip-path: polygon(0 0,100% 0,0 100%); transform-origin: 0 0;
  animation: dre-fold-left 2.25s cubic-bezier(.65,0,.2,1) forwards;
}
.dre-intro__fold--right {
  clip-path: polygon(100% 0,100% 100%,0 100%); transform-origin: 100% 100%;
  animation: dre-fold-right 2.25s cubic-bezier(.65,0,.2,1) forwards;
  filter: brightness(.96);
}
.dre-intro__brand {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 30px;
  animation: dre-intro-brand 2.25s ease forwards;
}
.dre-intro__brand img {
  display: block; width: 150px; height: 105px; object-fit: contain;
  max-width: 100%; filter: brightness(0);
}
.dre-intro__brand span { font-size: 10px; letter-spacing: .1em; color: #3d4435; }
.dre-intro__skip {
  position: absolute; bottom: max(30px, env(safe-area-inset-bottom));
  right: max(30px, env(safe-area-inset-right)); pointer-events: auto;
  font: 11px 'DRE Intro Manrope', sans-serif; color: #30362a;
  background: #e6e8df; padding: 12px 16px; min-height: 44px;
  border: 0; border-radius: 4px; cursor: pointer;
  animation: dre-intro-brand 2.25s ease forwards;
}
.dre-intro__skip:focus-visible { outline: 2px solid #536b24; outline-offset: 4px; }
@keyframes dre-fold-left {
  0% { transform: rotateX(-75deg); opacity: 0; }
  24%,64% { transform: rotateX(0); opacity: 1; }
  100% { transform: translate(-30%,-50%) rotateX(80deg); opacity: 0; }
}
@keyframes dre-fold-right {
  0% { transform: rotateY(70deg); opacity: 0; }
  24%,64% { transform: rotateY(0); opacity: 1; }
  100% { transform: translate(30%,50%) rotateY(-80deg); opacity: 0; }
}
@keyframes dre-intro-brand {
  0%,16% { opacity: 0; transform: scale(.9); }
  30%,62% { opacity: 1; transform: scale(1); }
  80%,100% { opacity: 0; transform: scale(.97); }
}
@media (max-width:767px) { .dre-intro__brand img { width:120px; } }
@media (prefers-reduced-motion:reduce) {
  .dre-intro { display:none; }
  .dre-intro * { animation:none !important; }
}

<!-- DEMO ONLY: not part of the loading intro. -->
<main class="demo">
  <h1>Your business.<br><span>All connected.</span></h1>
  <p>Standalone origami intro reference. The paper folds in, reveals the DRE logo, then unfolds to reveal your page.</p>
  <button type="button" id="dre-replay">Replay intro</button>
  <p id="dre-motion-note" hidden>Reduced motion is enabled on your device, so the intro is skipped.</p>
</main>

<script>
/* INTRO SCRIPT: no external dependencies. */
(() => {
  const oncePerSession = false; // Change to true when integrating into your site.
  const sessionKey = 'dre-origami-intro-seen';
  const duration = 2250; // Keep in sync with the 2.25s CSS animations.
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let overlay = null;
  let timer = null;
  let returnFocus = null;

  function finish() {
    window.clearTimeout(timer);
    timer = null;
    const skipHasFocus = overlay && overlay.contains(document.activeElement);
    if (overlay) overlay.remove();
    overlay = null;
    if (skipHasFocus && returnFocus && returnFocus.isConnected) returnFocus.focus();
    try { sessionStorage.setItem(sessionKey, '1'); } catch { /* Storage may be blocked. */ }
  }
  function play(force = false) {
    if (overlay) finish();
    const note = document.getElementById('dre-motion-note');
    if (note) note.hidden = !reducedMotion.matches;
    if (reducedMotion.matches) return;
    try { if (!force && oncePerSession && sessionStorage.getItem(sessionKey)) return; } catch {}
    returnFocus = document.activeElement;
    const template = document.getElementById('dre-intro-template');
    if (!template) return;
    overlay = template.content.firstElementChild.cloneNode(true);
    overlay.querySelector('.dre-intro__skip').addEventListener('click', finish, {once:true});
    document.body.appendChild(overlay);
    timer = window.setTimeout(finish, duration);
  }
  reducedMotion.addEventListener('change', () => {
    if (reducedMotion.matches && overlay) finish();
    const note = document.getElementById('dre-motion-note');
    if (note) note.hidden = !reducedMotion.matches;
  });
  document.getElementById('dre-replay')?.addEventListener('click', () => play(true));
  play();
})();
/* END INTRO SCRIPT */
</script>
</body>
